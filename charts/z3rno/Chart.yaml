apiVersion: v2
name: z3rno
description: Helm chart for Z3rno - the database for AI agent memory
type: application
version: 0.6.0
# v0.19.7 — optional bundled Postgres via CloudNativePG. Set
# ``z3rno-postgres.enabled=true`` in values.yaml when you want the
# chart to render a managed in-cluster cluster instead of pointing
# externalDatabase at RDS/Cloud SQL/Neon.
dependencies:
  - name: z3rno-postgres
    version: 0.1.0
    repository: "file://../z3rno-postgres"
    condition: z3rno-postgres.enabled
appVersion: 0.20.0
kubeVersion: ">=1.27.0"
home: https://github.com/the-ai-project-co/z3rno
sources:
  - https://github.com/the-ai-project-co/z3rno-server
  - https://github.com/the-ai-project-co/z3rno-helm
maintainers:
  - name: the-ai-project-co
    url: https://github.com/the-ai-project-co
keywords:
  - z3rno
  - ai
  - memory
  - agent
  - database
  - fastapi
