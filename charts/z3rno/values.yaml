# -- Z3rno Helm Chart Values
# -- Default values for z3rno chart

# -- Server (z3rno-server FastAPI)
server:
  image:
    repository: ghcr.io/the-ai-project-co/z3rno-server
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

# -- Celery Worker
worker:
  enabled: true
  replicas: 1
  command: "celery -A z3rno_server.workers.celery_app worker --loglevel=info"
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

# -- Celery Beat scheduler.
# Drives the periodic z3rno.audit_drain task which chains entries from
# audit_log_pending into audit_log. Required for v0.7.0+ — without it,
# audit_log_pending accumulates without bound. Beat is a singleton —
# do NOT scale beyond 1 replica with the default scheduler (would cause
# duplicate task scheduling).
beat:
  enabled: true
  replicas: 1
  command: "celery -A z3rno_server.workers.celery_app beat --loglevel=info"
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  # Audit drain tunables (forwarded as env vars to the beat + worker pods).
  audit:
    drainIntervalSeconds: "1.0"
    drainBatchSize: "500"
    maxOrgsPerTick: "100"

# -- Bundled Valkey (Redis-compatible cache)
valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "8"
    pullPolicy: IfNotPresent
  port: 6379
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# -- External PostgreSQL (managed DB: RDS, Cloud SQL, Neon, CloudNativePG, etc.)
externalDatabase:
  enabled: false
  host: ""
  port: 5432
  name: "z3rno"
  user: "z3rno"
  existingSecret: ""
  secretKey: "password"

# -- External Redis (ElastiCache, Upstash, etc.) - replaces bundled Valkey
externalRedis:
  enabled: false
  host: ""
  port: 6379
  existingSecret: ""
  secretKey: "redis-password"

# -- Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: z3rno.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Secrets (use existingSecret for production)
secrets:
  databaseUrl: ""
  redisUrl: ""
  openaiApiKey: ""
  z3rnoApiKey: "z3rno_sk_test_localdev"
  existingSecret: ""

# -- Horizontal Pod Autoscaler (targets server deployment)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# -- Pod Disruption Budget (targets server pods)
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# -- Additional environment variables
env: {}

# -- Phase F slice 7: multi-region failover.
# When ``enabled: true``, the chart:
#   * stamps ``z3rno.region`` and ``topology.kubernetes.io/zone`` labels
#     on every pod template (server / worker / beat).
#   * adds ``topologySpreadConstraints`` so replicas land across zones
#     within the region (``maxSkew: 1`` over ``topology.kubernetes.io/zone``).
#   * wires ``DATABASE_READ_URL`` from the same secret family as
#     ``databaseUrl`` so the server can route SELECT-side reads to the
#     region-local replica once the engine grows a read-router seam.
#   * adds ``secondaryRegions`` as a documentation field — operators
#     listing peer regions for their own GTM / cross-region failover
#     runbook (the chart itself doesn't dispatch traffic across regions).
#
# Off by default — single-region deploys are byte-identical to v0.2.x.
# -- Phase G slice 7: observability artifacts.
# Both blocks are opt-in. ``prometheusRules.enabled`` needs
# prometheus-operator in cluster (the resource is a CR);
# ``grafanaDashboard.enabled`` needs a Grafana sidecar that watches
# for ``grafana_dashboard=1`` labelled ConfigMaps. Either renders
# byte-identically as missing when disabled.
observability:
  prometheusRules:
    enabled: false
    extraLabels: {}
  grafanaDashboard:
    enabled: false
    extraLabels: {}

# v0.19.7 — optional bundled Postgres via CloudNativePG. Disabled
# by default so existing externalDatabase users see no change. When
# enabled, the parent release renders a Cluster CR; point
# ``secrets.databaseUrl`` / ``multiRegion.readDatabaseUrl`` at the
# resulting ``<release>-z3rno-rw`` / ``<release>-z3rno-ro`` services.
# Requires the CNPG operator pre-installed.
z3rno-postgres:
  enabled: false

multiRegion:
  enabled: false
  region: ""  # e.g. "us-east-1"; required when enabled.
  # When set, all pods get ``topology.kubernetes.io/zone`` topology-spread
  # so replicas land across the listed zones rather than concentrating.
  zones: []
  # Read replica DSN. Empty string leaves DATABASE_READ_URL unset —
  # the server falls back to DATABASE_URL for reads.
  readDatabaseUrl: ""
  # Optional list of peer regions for runbook documentation only.
  secondaryRegions: []

# -- Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Image pull secrets
imagePullSecrets: []

# -- Override chart name
nameOverride: ""
fullnameOverride: ""
