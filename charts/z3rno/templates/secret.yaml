{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "z3rno.fullname" . }}
  labels:
    {{- include "z3rno.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ include "z3rno.redisUrl" . | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  Z3RNO_API_KEY: {{ .Values.secrets.z3rnoApiKey | quote }}
  {{- if and .Values.multiRegion.enabled .Values.multiRegion.readDatabaseUrl }}
  # Phase F slice 7 — region-local read replica DSN. The server uses
  # DATABASE_URL for the primary; SELECT-side traffic routes here once
  # the engine's read-router seam lands (planned for v0.18). Until then
  # this is an operator-prepared knob — setting it is safe but unused.
  DATABASE_READ_URL: {{ .Values.multiRegion.readDatabaseUrl | quote }}
  {{- end }}
{{- end }}
