{{- if .Values.observability.grafanaDashboard.enabled }}
# Phase G slice 7 — Grafana dashboard ConfigMap.
#
# The ``grafana_dashboard: "1"`` label is the canonical Grafana
# sidecar discovery marker — when grafana-operator (or the bitnami
# Grafana chart) is in cluster, this ConfigMap is auto-loaded.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "z3rno.fullname" . }}-grafana-dashboard
  labels:
    {{- include "z3rno.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with .Values.observability.grafanaDashboard.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  z3rno-slo.json: |-
    {{- .Files.Get "dashboards/z3rno-slo.json" | nindent 4 }}
{{- end }}
