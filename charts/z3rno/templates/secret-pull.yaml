{{- /*
v0.19.10 — inline ghcr.io pull-secret rendering.

Operator UX:
  1. Pre-existing secret (recommended for prod):

       imagePullSecrets:
         - name: my-ghcr-pat

     The chart only references the secret; create it yourself with
     ``kubectl create secret docker-registry my-ghcr-pat ...``.

  2. Inline dockerconfigjson (good for dev / kind / starter-kit):

       imagePullSecret:
         create: true
         dockerconfigjson: "<base64-encoded ~/.docker/config.json>"

     The chart renders a Secret named ``<release>-ghcr-pull`` and adds
     it to the imagePullSecrets list automatically.

  3. ghcr.io PAT shorthand:

       imagePullSecret:
         create: true
         registry: ghcr.io
         username: <gh-username>
         password: <gh-pat>     # personal access token w/ read:packages

     Chart base64-encodes a dockerconfigjson for you.

When ``imagePullSecret.create`` is ``false`` (the default), this
template emits nothing — chart renders byte-identically to v0.19.9.
*/ -}}
{{- if .Values.imagePullSecret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-ghcr-pull" (include "z3rno.fullname" .) }}
  labels:
    {{- include "z3rno.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{- if .Values.imagePullSecret.dockerconfigjson }}
    {{- "" | indent 1 }}{{ .Values.imagePullSecret.dockerconfigjson | quote }}
  {{- else }}
    {{- $registry := .Values.imagePullSecret.registry | default "ghcr.io" -}}
    {{- $user := required "imagePullSecret.username required when dockerconfigjson is unset" .Values.imagePullSecret.username -}}
    {{- $pass := required "imagePullSecret.password required when dockerconfigjson is unset" .Values.imagePullSecret.password -}}
    {{- $auth := printf "%s:%s" $user $pass | b64enc -}}
    {{- $cfg := printf `{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}` $registry $user $pass $auth -}}
    {{- "" | indent 1 }}{{ $cfg | b64enc | quote }}
  {{- end }}
{{- end -}}
